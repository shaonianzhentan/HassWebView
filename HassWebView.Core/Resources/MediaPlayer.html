<!DOCTYPE html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>
    <title>Video Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: __HEIGHT__px;
            background-color: black;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <video controls autoplay src='__VIDEO_URL__'></video>

    <script>
        const video = document.querySelector('video');

        function videoSeek(seconds) {
            if (video) {
                video.currentTime += seconds;
            }
        }

        function playPause() {
            if (video) {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        }
    </script>
</body>
</html>
