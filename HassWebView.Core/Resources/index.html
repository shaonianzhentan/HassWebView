<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接到 Home Assistant</title>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <style>
        /* --- Base & Reset --- */
        html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
            color: #1c1e21;
        }

        /* --- Main Container --- */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* --- Card --- */
        .card {
            background-color: #fff;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        /* --- Logo --- */
        .logo {
            height: 30px;
            margin: 0 auto 24px;
        }

        /* --- Typography --- */
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 12px;
        }
        p {
            font-size: 16px;
            color: #606770;
            margin: 0 0 32px;
        }

        /* --- Input Group & Form --- */
        .input-group {
            display: flex;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f5f6f7;
            margin-bottom: 16px;
        }
        .protocol-selector, .url-input {
            border: none;
            padding: 14px;
            font-size: 16px;
            background: none;
            line-height: 1.5;
        }
        .protocol-selector {
            background-color: #e4e6eb;
            color: #606770;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .url-input {
            flex-grow: 1;
            width: 100%;
            min-width: 0;
            padding-left: 10px;
        }
        .url-input:focus {
            outline: none;
            background-color: #fff;
        }
        .connect-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            border: none;
            padding: 14px;
            font-size: 16px;
            line-height: 1.5;
            border-radius: 8px;
        }

        /* --- Loading Spinner --- */
        #loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #007bff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        #loading-text {
            color: #333;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Toast Notification --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            max-width: 90%;
            background-color: rgba(15, 23, 42, 0.9);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 10001;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            font-size: 16px;
            white-space: normal;
            word-wrap: break-word;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
        
        #tv {
            display: none;
        }

    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text"></div>
    </div>
    <div id="toast"></div>

    <div class="container">
        <div class="card">
            <img src="https://www.home-assistant.io/images/home-assistant-logo.svg" alt="Home Assistant" class="logo">
            <h1>欢迎回来</h1>
            <p>请输入您的 Home Assistant 地址</p>
            <form id="connect-form" onsubmit="return false;">
                <div class="input-group">
                    <span id="protocol-toggle" class="protocol-selector">http://</span>
                    <input type="text" class="url-input" id="ha-url" placeholder="example.com:8123" required>
                </div>
                <button type="submit" class="connect-btn">连接</button>
            </form>
        </div>
        <div id="tv">
             <img src="" style="width: 200px; height: 200px; margin: 20px auto; display: block;"/>
        </div>
    </div>

    <script>
        // --- App Communication (C# to WebView) ---
        // This function is CALLED BY C# to send messages TO the WebView.
        window.externalBus = function (msg) {
            console.log("Message received from C#: " + msg);
            hideLoading();
            var message;
            try {
                // C# sends a JSON string, so we must parse it into an object.
                message = JSON.parse(msg);
            } catch (e) {
                console.error("Could not parse message from C# as JSON: ", msg);
                showToast("收到来自应用的消息，但格式无法解析。");
                return;
            }

            switch(message.type){
                case 'webview/url':
                    $("#tv img").attr("src", "https://cdn.dotmaui.com/qrc/?t=" + encodeURIComponent(message.data));
                    $("#tv").show();
                    break;
                case 'webview/auth':
                    showToast(message.message);
                    break;
                case 'x5/init': 
                    showToast("腾讯X5内核加载成功，可以正常使用啦");
                    break;
                default:
                    console.warn("Received unknown message type: " + message.type);
                    break;
            }
        };

        // --- UI Control Functions (ES5 Compliant) ---
        function showLoading(message) {
            message = message || '请稍候...';
            $('#loading-text').text(message);
            $('#loading').css('display', 'flex');
        }
        function hideLoading() { 
            $('#loading').hide();
            $('#loading-text').text('');
        }
        var toastTimer;
        function showToast(message, duration) {
            duration = duration || 4000;
            var toast = $('#toast');
            clearTimeout(toastTimer);
            toast.text(message).addClass('show');
            toastTimer = setTimeout(function() { toast.removeClass('show'); }, duration);
        }
        
        // --- Compatibility Check ---
        function checkWebViewCompatibility() {
            var result = { isCompatible: true, reason: "" };
            try {
                var ua = navigator.userAgent;
                var chromeMatch = ua.match(/Chrome\/(\d+)/);
                var chromeVersion = chromeMatch ? parseInt(chromeMatch[1], 10) : 0;
                
                var shadowDOM = !!(document.head.attachShadow || document.head.createShadowRoot);
                var customElements = 'customElements' in window;
                var optionalChaining = false;
                try { eval('var a={}; a?.b'); optionalChaining = true; } catch (e) {}

                if (!customElements || !shadowDOM) {
                    result.isCompatible = false;
                    result.reason = "硬件不支持 Web Components (Shadow DOM)，Home Assistant 将无法渲染。";
                } else if (!optionalChaining) {
                    result.isCompatible = false;
                    result.reason = "JS 引擎过旧（不支持 Optional Chaining），会导致前端脚本报错。";
                } else if (chromeVersion > 0 && chromeVersion < 90) {
                    result.isCompatible = false;
                    result.reason = "Chromium 内核版本 (" + chromeVersion + ") 低于 HA 官方推荐的 90+。";
                }
            } catch(e) {
                result.isCompatible = false;
                result.reason = "检查兼容性时发生未知错误: " + e.message;
            }
            return result;
        }

        // --- Initialization ---
        $(document).ready(function() {
            var form = $('#connect-form');
            var input = $('#ha-url');
            var btnProtocol = $('#protocol-toggle');

            // Check compatibility
            var compatibility = checkWebViewCompatibility();
            if (!compatibility.isCompatible) {
                showLoading("正在加载兼容内核...");
                showToast(compatibility.reason, 8000);
                if(window.externalApp && window.externalApp.externalBus){
                    window.externalApp.externalBus(JSON.stringify({ type: 'x5/init' }));
                } else {
                    console.warn("Not in C# environment, cannot call externalApp for X5 init.");
                }
            }

            // Bind Events
            btnProtocol.on('click', function() {
                var currentProtocol = btnProtocol.text();
                btnProtocol.text(currentProtocol === 'http://' ? 'https://' : 'http://');
            });

            // --- App Communication (WebView to C#) ---
            form.on('submit', function(event) {
                event.preventDefault();
                var url = input.val().trim();
                if (url) {
                    if ($("#loading").is(":visible")) { return; }
                    showLoading("正在验证地址...");
                    
                    var fullUrl = btnProtocol.text() + url;
                    if(window.externalApp && window.externalApp.externalBus) {
                         window.externalApp.externalBus(JSON.stringify({
                            type: 'webview/auth',
                            data: fullUrl
                        }));
                    } else {
                        // This block runs for basic browser testing when not in the C# app.
                        console.warn("Not in C# environment. URL to verify: " + fullUrl);
                        hideLoading();
                        showToast("当前不在应用环境中，无法连接。");
                    }
                } else {
                    showToast("请输入您的 Home Assistant 地址");
                }
            });
        });
    </script>
</body>
</html>
